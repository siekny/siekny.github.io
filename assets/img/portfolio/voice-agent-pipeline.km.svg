<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" font-family="'Noto Sans Khmer', 'Khmer UI', 'Khmer Sangam MN', 'Leelawadee UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">បណ្តាញដំណើរការរបស់ភ្នាក់ងារសំឡេង</title>
  <desc id="d">ការសន្ទនាដោយសំឡេងមួយជុំ៖ ពាក្យដាស់ ការចាប់សំឡេង សំឡេងទៅជាអត្ថបទ អ្នកបញ្ជូនបន្តដោយច្បាប់ជាមុន ការគ្រប់គ្រងអេក្រង់ ឬការបង្វឹកដោយ RAG និងចម្លើយជាសំឡេង។</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f2943"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e87532"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="430" rx="18" fill="#ffffff"/>

  <text x="550" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f2943">ការសន្ទនាដោយសំឡេងមួយជុំ</text>

  <!-- Stage boxes -->
  <g font-size="15" font-weight="700" fill="#0f2943" text-anchor="middle">
    <rect x="20" y="120" width="155" height="90" rx="12" fill="#fdf1ea" stroke="#e87532" stroke-width="2"/>
    <text x="97.5" y="155">ពាក្យដាស់</text>

    <rect x="195" y="120" width="155" height="90" rx="12" fill="#f3f6f9" stroke="#0f2943" stroke-width="1.5"/>
    <text x="272.5" y="155">ការចាប់សំឡេង</text>

    <rect x="370" y="120" width="155" height="90" rx="12" fill="#f3f6f9" stroke="#0f2943" stroke-width="1.5"/>
    <text x="447.5" y="155">សំឡេង → អត្ថបទ</text>

    <rect x="545" y="120" width="155" height="90" rx="12" fill="#fdf1ea" stroke="#e87532" stroke-width="2"/>
    <text x="622.5" y="155">អ្នកបញ្ជូនបន្ត</text>

    <rect x="740" y="55" width="160" height="80" rx="12" fill="#f3f6f9" stroke="#0f2943" stroke-width="1.5"/>
    <text x="820" y="88">ពាក្យបញ្ជា</text>

    <rect x="740" y="195" width="160" height="80" rx="12" fill="#fdf1ea" stroke="#e87532" stroke-width="2"/>
    <text x="820" y="228">សំណួរ</text>

    <rect x="935" y="120" width="145" height="90" rx="12" fill="#f3f6f9" stroke="#0f2943" stroke-width="1.5"/>
    <text x="1007.5" y="155">អត្ថបទ → សំឡេង</text>
  </g>

  <!-- Stage details -->
  <g font-size="12.5" fill="#4a5a6a" text-anchor="middle">
    <text x="97.5" y="177">ម៉ូដែលផ្ទាល់ខ្លួន</text>
    <text x="97.5" y="195">"Hi ○○"</text>

    <text x="272.5" y="177">VAD + ចុងវេននិយាយ</text>
    <text x="272.5" y="195">ម៉ូដែល</text>

    <text x="447.5" y="177">ជាលំហូរ,</text>
    <text x="447.5" y="195">វាក្យសព្ទជំនាញ</text>

    <text x="622.5" y="177">ច្បាប់ជាមុន,</text>
    <text x="622.5" y="195">LLM ពេលមិនច្បាស់</text>

    <text x="820" y="108">ប្តូរអេក្រង់</text>
    <text x="820" y="124">ផ្អាក · ចាក់វីដេអូ</text>

    <text x="820" y="248">RAG លើកំណត់ត្រា</text>
    <text x="820" y="264">+ មូលដ្ឋានចំណេះដឹង</text>

    <text x="1007.5" y="177">ចម្លើយជាលំហូរ,</text>
    <text x="1007.5" y="195">អេក្រង់ធ្វើតាម</text>
  </g>

  <!-- Flow arrows -->
  <g stroke="#0f2943" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="175" y1="165" x2="192" y2="165"/>
    <line x1="350" y1="165" x2="367" y2="165"/>
    <line x1="525" y1="165" x2="542" y2="165"/>
    <path d="M700,165 H714 V95 H737"/>
    <path d="M700,165 H714 V235 H737"/>
    <path d="M900,95 H914 V165 H932"/>
    <path d="M900,235 H914 V165" marker-end="none"/>
  </g>

  <!-- Barge-in loop -->
  <path d="M1007.5,210 V300 H97.5 V213" fill="none" stroke="#e87532" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-accent)"/>
  <rect x="380" y="286" width="340" height="28" rx="14" fill="#ffffff"/>
  <text x="550" y="305" text-anchor="middle" font-size="13.5" fill="#c4581c" font-weight="700">ការកាត់សម្ដី៖ អ្នកប្រើអាចកាត់ចម្លើយបាន</text>

  <!-- Online / offline -->
  <g font-size="13.5" text-anchor="middle">
    <rect x="110" y="350" width="400" height="48" rx="24" fill="#f3f6f9"/>
    <text x="310" y="379" fill="#0f2943"><tspan font-weight="700">អនឡាញ៖</tspan> STT, LLM, TTS លើពពក</text>
    <rect x="590" y="350" width="400" height="48" rx="24" fill="#f3f6f9"/>
    <text x="790" y="379" fill="#0f2943"><tspan font-weight="700">គ្មានអ៊ីនធឺណិត៖</tspan> ប្តូរទៅម៉ូដែលលើឧបករណ៍</text>
  </g>
</svg>
